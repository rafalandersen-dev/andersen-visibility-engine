<!doctype html><html lang="en"><meta charset="utf-8"><title>Milo responsive QA</title><style>body{margin:0;background:#e7ecf1;font:14px system-ui}header{padding:12px;display:flex;gap:10px;align-items:center}button,select{padding:8px}iframe{border:0;background:white;display:block;margin:0 12px;box-shadow:0 0 0 1px #c3cdd7}</style><header><span>Local QA viewport</span><select id="size" aria-label="Viewport"><option>390</option><option>768</option><option>1024</option><option>1280</option></select><button data-route="/app">Today</button><button data-route="/app/plan?view=list">List</button><button data-route="/app/plan?view=calendar">Calendar</button><button data-route="/app/setup">Setup</button></header><iframe id="app" title="Milo preview" src="/app" width="390" height="844"></iframe><script>const frame=document.getElementById('app');document.getElementById('size').onchange=event=>frame.width=event.target.value;document.querySelectorAll('[data-route]').forEach(button=>button.onclick=()=>frame.src=button.dataset.route);</script></html>
