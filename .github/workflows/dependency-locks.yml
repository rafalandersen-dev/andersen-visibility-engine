name: Dependency lock consistency

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - bunfig.toml
      - .github/workflows/dependency-locks.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - bun.lock
      - bunfig.toml
      - .github/workflows/dependency-locks.yml

permissions:
  contents: read

jobs:
  frozen-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Verify Bun manifest and frozen dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify npm manifest and lock agreement
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund
      - name: Refuse lock rewrites
        run: git diff --exit-code -- package.json package-lock.json bun.lock bunfig.toml
      - name: Test the frozen Bun dependency tree
        run: npm test
      - name: Typecheck the frozen Bun dependency tree
        run: npx --no-install tsc --noEmit
      - name: Build with the frozen Bun dependency tree
        run: npm run build
